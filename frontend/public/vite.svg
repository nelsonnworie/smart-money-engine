<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Hexagon background -->
  <polygon 
    points="20,2 35,10.5 35,29.5 20,38 5,29.5 5,10.5" 
    fill="#0f172a" 
    stroke="#00d4aa" 
    stroke-width="1.5"
  />
  <!-- Inner ring -->
  <polygon 
    points="20,7 31,13.5 31,26.5 20,33 9,26.5 9,13.5" 
    fill="none" 
    stroke="#00d4aa" 
    stroke-width="0.5" 
    opacity="0.4"
  />
  <!-- Center cross/target -->
  <circle cx="20" cy="20" r="4" fill="none" stroke="#00d4aa" stroke-width="1.5"/>
  <line x1="20" y1="13" x2="20" y2="17" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="23" x2="20" y2="27" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="20" x2="17" y2="20" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="23" y1="20" x2="27" y2="20" stroke="#00d4aa" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dot in center -->
  <circle cx="20" cy="20" r="1.5" fill="#00d4aa"/>
</svg>